# Prime Bank Chatbot Backend Configuration

# Vector Database Storage Configuration
vector_db:
  persist_directory: "/app/backend/data/vector_db"  # Path to store vector DB
  collection_name: "prime_bank_products"            # ChromaDB collection name

# Embedding Model Configuration
embeddings:
  model_name: "sentence-transformers/all-minilm-l6-v2"
  device: "cpu"  # Use "cuda" if GPU available
  batch_size: 32

# Knowledge Base Configuration
knowledge_base:
  root_path: "/app/knowledge_base"            # Root path for KB files
  conventional_path: "conventional"           # Folder for conventional products
  islamic_path: "islami"                      # Folder for Islamic products

# LLM Configuration for RAG Pipeline
llm:
  base_url: "http://ollama:11434"  # Ollama service URL in Docker
  model_name: "qwen2.5:7b-instruct-q4_k_m"
  temperature: 0.3
  top_p: 0.9
  timeout: 180
  top_k: 1.0

# Chunking Strategy for Knowledge Base
chunking:
  strategy: "semantic"  # Can be "fixed", "semantic", "hybrid"
  chunk_size: 500         # Characters per chunk (for fixed strategy)
  chunk_overlap: 100      # Character overlap between chunks
  min_chunk_size: 50      # Minimum chunk size to keep

# RAG Pipeline Settings
rag:
  top_k_retrieval: 6      # Number of chunks to retrieve for RAG
  rerank: false           # Enable reranking if expensive (set True for production)
  temperature: 0.0        # Lower = deterministic answers (for structured output)
  similarity_threshold: 0.4

# Fallback Responses
fallback:
  out_of_scope: "I can only help with Prime Bank products and services. Feel free to ask about credit cards, loans, or savings accounts!"
  low_confidence: "I don't have enough information to answer that accurately. Please call 16218 or visit any Prime Bank branch."
  error: "Something went wrong. Please call 16218 or visit any Prime Bank branch."

# Features
features:
  enable_clarification: true     # Ask users for clarification on vague queries
  enable_profiling: true         # Create customer profiles for better recommendations  
  enable_eligibility: true       # Enable eligibility checking for products
  enable_comparison: true        # Enable product comparison features
